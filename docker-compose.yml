name: mediaforge-prompt-studio-public

services:
  mediaforge:
    build:
      context: .
      dockerfile: Dockerfile
    image: mediaforge-prompt-studio:v0.2-dev
    container_name: mediaforge-prompt-studio
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MEDIAFORGE_APP_PORT:-18888}:8080"
    environment:
      MEDIAFORGE_DMR_URL: ${MEDIAFORGE_DMR_URL:-http://host.docker.internal:12434/engines/llama.cpp/v1}
      MEDIAFORGE_DMR_API_KEY: ${MEDIAFORGE_DMR_API_KEY:-docker-model-runner}
      MEDIAFORGE_MODEL: ${MEDIAFORGE_MODEL:-ai/qwen2.5:3B-Q4_K_M}
      MEDIAFORGE_OVMS_IMAGE_URL: ${MEDIAFORGE_OVMS_IMAGE_URL:-http://ovms-sdxl:8000/v3}
      MEDIAFORGE_OVMS_IMAGE_MODEL: ${MEDIAFORGE_OVMS_IMAGE_MODEL:-OpenVINO/stable-diffusion-xl-base-1.0-int8-ov}
      MEDIAFORGE_DEFAULT_LANGUAGE: English
      MEDIAFORGE_RUNTIME_MODE: ${MEDIAFORGE_RUNTIME_MODE:-auto}
      MEDIAFORGE_RUNTIME_PROFILE_PATH: /runtime/runtime-profile.json
      MEDIAFORGE_IMAGE_DEVICE: ${MEDIAFORGE_IMAGE_DEVICE:-CPU}
    volumes:
      - ./runtime:/runtime:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - ovms-sdxl

  ovms-sdxl:
    image: openvino/model_server:latest
    container_name: mediaforge-ovms-sdxl-cpu
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MEDIAFORGE_OVMS_PORT:-8010}:8000"
    volumes:
      - ./data/ovms-models:/models
    command:
      - --rest_port
      - "8000"
      - --model_repository_path
      - /models
      - --task
      - image_generation
      - --source_model
      - OpenVINO/stable-diffusion-xl-base-1.0-int8-ov
      - --target_device
      - ${MEDIAFORGE_IMAGE_DEVICE:-CPU}
