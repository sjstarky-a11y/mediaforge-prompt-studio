<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Starting MediaForge Prompt Studio</title>
  <style>
    html { color-scheme: dark; background: #0b0b10; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
      color: #f6f1ff; font: 16px/1.6 system-ui, sans-serif;
      background: radial-gradient(ellipse at top, #292039, #0b0b10 70%); }
    main { max-width: 28rem; padding: 2rem; text-align: center; }
    h1 { font-size: 1.5rem; line-height: 1.3; }
    p { color: #bcb4cc; }
    .spinner { width: 2.5rem; height: 2.5rem; margin: 0 auto 1.5rem;
      border: 3px solid #3a304c; border-top-color: #5fe0c0;
      border-radius: 50%; animation: spin 1s linear infinite; }
    button { border: 0; border-radius: .7rem; padding: .8rem 1.3rem;
      background: #5fe0c0; color: #0b0b10; font: inherit; font-weight: 650; cursor: pointer; }
    [hidden] { display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
  </style>
</head>
<body>
  <main>
    <div class="spinner" id="spinner" aria-hidden="true"></div>
    <h1>MediaForge Prompt Studio</h1>
    <p id="status" role="status" aria-live="polite">Starting MediaForge… The app will open automatically when it is ready.</p>
    <button id="retry" type="button" hidden>Try again</button>
    <noscript><p>JavaScript is needed to open the app automatically. Enable it, then refresh this page.</p></noscript>
  </main>
  <script>
    const status = document.getElementById("status");
    const retry = document.getElementById("retry");
    const spinner = document.getElementById("spinner");
    let deadline = Date.now() + 60000;
    let timer;

    async function checkReady() {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 3000);
      try {
        const response = await fetch("/health", {cache: "no-store", signal: controller.signal});
        if (response.ok) {
          window.location.reload();
          return;
        }
      } catch (error) {
        // The listener stays open, but tolerate a temporary network failure too.
      } finally {
        clearTimeout(timeout);
      }
      if (Date.now() >= deadline) {
        spinner.hidden = true;
        status.textContent = "MediaForge is taking longer than expected. Try again, or check the Logs tab in Pi Desktop.";
        retry.hidden = false;
        return;
      }
      timer = setTimeout(checkReady, 500);
    }

    retry.addEventListener("click", () => {
      clearTimeout(timer);
      deadline = Date.now() + 60000;
      retry.hidden = true;
      spinner.hidden = false;
      status.textContent = "Waiting for MediaForge… The app will open automatically when it is ready.";
      checkReady();
    });
    checkReady();
  </script>
</body>
</html>
