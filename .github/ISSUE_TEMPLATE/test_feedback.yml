name: Test feedback
description: Share a short Windows, Linux or GPU validation result
title: "[Test]: "
labels: [public-test]
body:
  - type: input
    id: version
    attributes:
      label: Version and system
      placeholder: v0.4-preview; OS, Docker, RAM, GPU/driver
    validations:
      required: true
  - type: textarea
    id: tested
    attributes:
      label: What did you test?
      placeholder: Install, selected text/image backend, generation, stop/restart; pass/fail for each
    validations:
      required: true
  - type: textarea
    id: findings
    attributes:
      label: Findings
      description: Separate execution time and device selection from text/image quality. Use public examples only.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed private prompts, model inventories, personal paths and credentials.
          required: true
