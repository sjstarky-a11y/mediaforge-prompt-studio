title: "MediaForge Prompt Studio v0.3.1 Configurator"

eyebrow: "Director's Cut AI Pro · Local Prompt Doctor + Visual Proof"

description: >
  Before installing, start Docker Desktop and wait until Docker Engine
  is running. In Docker Desktop Settings > AI, make sure Docker Model
  Runner is enabled.

  No external API keys are required.

  MediaForge Prompt Studio runs locally in Docker and uses a local
  Prompt Doctor model through Docker Model Runner.

  On the first installation, Docker may need to download the local
  Prompt Doctor model. This can take some time depending on your
  internet connection and computer.

  Optional Visual Proof can create one image or three image options
  directly on your computer. The first Visual Proof request downloads
  an additional approximately 12 GB local image model.

  After the models are downloaded, local generation has no per-image
  service fees.

  MediaForge Prompt Studio keeps the workflow local, isolated and
  portable.

  For Visual Proof, the Config panel lets you choose how much CPU power
  the image generator may use.

  Your prompts, decisions and generated images stay on your computer.

  Keep at least 20 GB of free disk space when using Visual Proof.

  MediaForge Prompt Studio is part of the broader Director's Cut AI Pro
  project.

  Web: https://directors-cut-ai-pro.vercel.app/

  GitHub: https://github.com/sjstarky-a11y

output_file: ".env"

after_save: >
  Saved. Keep Docker Desktop running and make sure Docker Model Runner
  is enabled. Pi Desktop will recreate MediaForge with the selected
  local features.

footer_hint: >
  Requires Docker Desktop with Docker Model Runner enabled.
  Visual Proof is optional, local and CPU-limited to help protect
  Pi Node stability.

fixed_values:
  - name: MEDIAFORGE_MODEL
    value: "ai/qwen2.5:3B-Q4_K_M"
    env_comment: "Validated local Prompt Doctor model for MediaForge SoloHost."

  - name: MEDIAFORGE_DMR_API_KEY
    value: "docker-model-runner"
    env_comment: "Placeholder bearer token for the local Docker Model Runner connection. No external API key is required."

  - name: COMPOSE_PROFILES
    value: "enabled"
    env_comment: "Internal profile gate. The user-facing Visual Proof mode decides whether the Hero service joins this active profile."

fields:
  - name: MEDIAFORGE_DEFAULT_LANGUAGE
    label: "Default output language"
    type: select
    default: "English"
    required: true
    help: "Choose English or Croatian as the default Prompt Doctor output language."
    env_comment: "Default generated output language."
    options:
      - value: "English"
        label: "English"
      - value: "Croatian"
        label: "Croatian"

  - name: MEDIAFORGE_VISUAL_PROOF_MODE
    label: "Optional Visual Proof"
    type: select
    default: "disabled"
    required: true
    help: >
      Enable Visual Proof to generate one image or three image options
      directly on your computer. The first image request downloads the
      approximately 12 GB local model. After that, local image generation
      has no per-image service fees and requires no external API key.
    env_comment: "Controls whether the optional local Visual Proof service is included."
    options:
      - value: "disabled"
        label: "Core only - Prompt Doctor"
      - value: "enabled"
        label: "Enable Visual Proof - one image or three image options"

  - name: MEDIAFORGE_HERO_CPU_LIMIT
    label: "Visual Proof CPU limit"
    type: select
    default: "8.0"
    required: true
    help: >
      Choose how much CPU power the local image generator may use.
      Eight CPU cores is the recommended default for a workstation
      that also runs Pi Node.
    env_comment: "CPU quota applied only to the optional local Visual Proof service."
    options:
      - value: "4.0"
        label: "4 CPU cores - conservative"
      - value: "8.0"
        label: "8 CPU cores - recommended"
      - value: "12.0"
        label: "12 CPU cores - faster"
      - value: "16.0"
        label: "16 CPU cores - high-performance workstation"
