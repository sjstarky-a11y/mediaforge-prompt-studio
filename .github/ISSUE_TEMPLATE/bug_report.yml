name: Bug report
description: Report a reproducible installation, text, image or hardware problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Use a small public example. Exclude private prompts, model inventories, credentials and full logs."
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.4-preview
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Install / start / stop
        - Prompt Doctor / language
        - Fidelity Guard / Intent Lock
        - Fast / Quality Proof
        - Hero Frame Set
        - Model Adapter
        - GPU / runtime detection
        - Memory / performance
        - Other
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: System
      placeholder: OS, native Linux or WSL2, Docker version, CPU, RAM, GPU and driver
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: "1. Start… 2. Select… 3. Observe…"
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual result
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics (optional)
      description: Paste the allowlisted doctor-report.json or a minimal sanitized error. Do not paste raw status or logs.
      render: json
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I checked existing issues and removed private information.
          required: true
