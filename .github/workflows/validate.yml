name: Validate public package

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Python syntax
        run: python -m py_compile app/main.py app/fidelity_concepts.py app/model_catalog.py app/proof_constraints.py app/runtime_status.py image_cuda/server.py

      - name: Validate model catalog
        run: python -m json.tool models/model-catalog.json > /dev/null

      - name: Validate browser JavaScript syntax
        run: |
          node -e 'const fs=require("fs"); const html=fs.readFileSync("app/index.html","utf8"); const script=html.match(/<script>([\s\S]*?)<\/script>/); if(!script) throw new Error("script not found"); new Function(script[1]);'

      - name: Run runtime profile tests
        run: python -m unittest discover -s tests -v

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $files = @(
            "detect-hardware.ps1",
            "detect-runtime.ps1",
            "install.ps1",
            "manage-models.ps1",
            "runtime-policy.ps1",
            "start.ps1",
            "status.ps1",
            "stop.ps1"
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_ }
              exit 1
            }
          }

      - name: Validate NVIDIA runtime policy
        shell: pwsh
        run: |
          & ./tests/test-runtime-policy.ps1

      - name: Validate Docker Compose
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.nvidia.yml config --quiet

      - name: Confirm private runtime files are absent
        shell: bash
        run: |
          test ! -f .env
          test ! -f runtime/hardware-profile.json
          test ! -f runtime/runtime-profile.json
          test ! -f runtime/install-log.txt
          test ! -d data
