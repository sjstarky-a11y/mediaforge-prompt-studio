name: Validate public package

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Python syntax
        run: python -m py_compile app/main.py

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Confirm private runtime files are absent
        shell: bash
        run: |
          test ! -f .env
          test ! -f runtime/hardware-profile.json
          test ! -f runtime/install-log.txt
          test ! -d data
